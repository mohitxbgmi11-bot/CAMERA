name: Run CAMERA PHP Project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract ZIP
      run: |
        unzip "CAMERA PLUS LOCATION.zip"
        cd "CAMERA PLUS LOCATION"
        ls -la
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Run PHP Server
      run: |
        cd "CAMERA PLUS LOCATION"
        php -S localhost:8000 &
    
    - name: Test Connection
      run: |
        sleep 2
        curl http://localhost:8000/index.php
